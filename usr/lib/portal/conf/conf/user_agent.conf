# User-Agent Configuration - Multi Browser Support

# --- FIREFOX 152 (Windows) ---
UA_FIREFOX="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:152.0) Gecko/20100101 Firefox/152.0"
ACCEPT_FIREFOX="text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
ACCEPT_LANG_FIREFOX="en-US,en;q=0.9"
ACCEPT_ENCODING_FIREFOX="gzip, deflate, br, zstd"
SEC_FETCH_SITE_FIREFOX="cross-site"
PRIORITY_FIREFOX="u=0, i"
SEC_CH_UA_FIREFOX=""
SEC_CH_UA_MOBILE_FIREFOX=""
SEC_CH_UA_PLATFORM_FIREFOX=""
BROWSER_NAME_FIREFOX="FIREFOX"

# --- CHROME 150 (Windows) ---
UA_CHROME="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
ACCEPT_CHROME="text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
ACCEPT_LANG_CHROME="id-ID,id;q=0.9,en-US;q=0.8,en;q=0.7"
ACCEPT_ENCODING_CHROME="gzip, deflate, br, zstd"
SEC_FETCH_SITE_CHROME="none"
PRIORITY_CHROME=""
SEC_CH_UA_CHROME="\"Not;A=Brand\";v=\"8\", \"Chromium\";v=\"150\", \"Google Chrome\";v=\"150\""
SEC_CH_UA_MOBILE_CHROME="?0"
SEC_CH_UA_PLATFORM_CHROME="\"Windows\""
BROWSER_NAME_CHROME="CHROME"

# --- loginjs-specific overrides ---
SEC_FETCH_SITE_LOGINJS_FIREFOX="same-origin"
SEC_FETCH_SITE_LOGINJS_CHROME="same-origin"
DNT_FIREFOX=""
DNT_CHROME="1"

# --- hotspot-specific overrides ---
ACCEPT_ENCODING_HOTSPOT_FIREFOX="gzip, deflate"
ACCEPT_ENCODING_HOTSPOT_CHROME="gzip, deflate"
SEC_FETCH_SITE_HOTSPOT_FIREFOX=""
SEC_FETCH_SITE_HOTSPOT_CHROME=""
SEC_CH_UA_HOTSPOT_FIREFOX=""
SEC_CH_UA_HOTSPOT_CHROME=""
SEC_CH_UA_MOBILE_HOTSPOT_FIREFOX=""
SEC_CH_UA_MOBILE_HOTSPOT_CHROME=""
SEC_CH_UA_PLATFORM_HOTSPOT_FIREFOX=""
SEC_CH_UA_PLATFORM_HOTSPOT_CHROME=""

# --- HEADER ORDER SEQUENCE (Data-Driven Wire-Level Fingerprint) ---
# Chrome: Wajib menyertakan Sec-Fetch-* dan DNT (Perilaku Wire-Level Asli)
HEADER_ORDER_CHROME="Host|Connection|sec-ch-ua|sec-ch-ua-mobile|sec-ch-ua-platform|Upgrade-Insecure-Requests|User-Agent|Accept|Sec-Fetch-Site|Sec-Fetch-Mode|Sec-Fetch-Dest|Accept-Encoding|Accept-Language|DNT|Cache-Control|Pragma"

# Firefox: Tanpa DNT dan Sec-Fetch-* (Fidelitas 100% Copy-Paste Referensi)
HEADER_ORDER_FIREFOX="Host|User-Agent|Accept|Accept-Language|Accept-Encoding|Connection|Upgrade-Insecure-Requests|Priority|Pragma|Cache-Control"

# --- WMS-SPECIFIC HEADER ORDER OVERRIDE ---
# Chrome WMS: Urutan presisi wire-level 100% sesuai DevTools cURL bash export (tanpa Cookie & tanpa Referer, karena ini entry point)
HEADER_ORDER_WMS_CHROME="Host|Accept|Accept-Language|Cache-Control|Connection|DNT|Pragma|Sec-Fetch-Dest|Sec-Fetch-Mode|Sec-Fetch-Site|Sec-Fetch-User|Upgrade-Insecure-Requests|User-Agent|sec-ch-ua|sec-ch-ua-mobile|sec-ch-ua-platform"

# Firefox WMS: Urutan presisi wire-level 100% sesuai DevTools cURL POSIX export (tanpa Cookie & tanpa Referer)
HEADER_ORDER_WMS_FIREFOX="Host|User-Agent|Accept|Accept-Language|Accept-Encoding|Connection|Upgrade-Insecure-Requests|Sec-Fetch-Dest|Sec-Fetch-Mode|Sec-Fetch-Site|Sec-Fetch-User|Priority|Pragma|Cache-Control"

# --- LOGINJS-SPECIFIC HEADER ORDER OVERRIDE ---
# Chrome LoginJS: Urutan presisi wire-level 100% sesuai DevTools cURL bash export (tanpa Cookie, karena ditangani flag -b)
HEADER_ORDER_LOGINJS_CHROME="Host|Accept|Accept-Language|Cache-Control|Connection|DNT|Pragma|Referer|Sec-Fetch-Dest|Sec-Fetch-Mode|Sec-Fetch-Site|Sec-Fetch-User|Upgrade-Insecure-Requests|User-Agent|sec-ch-ua|sec-ch-ua-mobile|sec-ch-ua-platform"

# Firefox LoginJS: Urutan presisi wire-level 100% sesuai DevTools cURL POSIX export
HEADER_ORDER_LOGINJS_FIREFOX="Host|User-Agent|Accept|Accept-Language|Accept-Encoding|Referer|Connection|Upgrade-Insecure-Requests|Sec-Fetch-Dest|Sec-Fetch-Mode|Sec-Fetch-Site|Sec-Fetch-User|Priority|Pragma|Cache-Control"

# --- CLASSIC-SPECIFIC HEADER ORDER OVERRIDE ---
# Chrome Classic: Tanpa Referer, Sec-Fetch-Site: none
HEADER_ORDER_CLASSIC_CHROME="Host|Connection|sec-ch-ua|sec-ch-ua-mobile|sec-ch-ua-platform|Upgrade-Insecure-Requests|User-Agent|Accept|Sec-Fetch-Site|Sec-Fetch-Mode|Sec-Fetch-Dest|Sec-Fetch-User|Accept-Encoding|Accept-Language|DNT|Cache-Control|Pragma"

# Firefox Classic: Tanpa Referer, Sec-Fetch-Site: none
HEADER_ORDER_CLASSIC_FIREFOX="Host|User-Agent|Accept|Accept-Language|Accept-Encoding|Connection|Upgrade-Insecure-Requests|Sec-Fetch-Dest|Sec-Fetch-Mode|Sec-Fetch-Site|Sec-Fetch-User|Priority|Pragma|Cache-Control"